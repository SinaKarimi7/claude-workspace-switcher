name: Windows build

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: bin/Claude Workspace Switcher.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    environment: release
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-executable
      - name: Authenticate to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_PROFILE }}
          files: ${{ github.workspace }}\Claude Workspace Switcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify timestamped Authenticode signature
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath '.\Claude Workspace Switcher.exe'
          if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
            throw "Release signature verification failed ($($signature.Status))."
          }
          Write-Host "Verified publisher $($signature.SignerCertificate.Subject)"
      - name: Publish Windows executable
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" "Claude Workspace Switcher.exe" --repo "$env:GITHUB_REPOSITORY" --clobber
          } else {
            gh release create "$env:TAG" "Claude Workspace Switcher.exe" --repo "$env:GITHUB_REPOSITORY" --verify-tag --generate-notes
          }
